<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background / Drop shadow filter -->
    <filter id="folder-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#050d1a" flood-opacity="0.38"/>
    </filter>
    <filter id="doc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0a1a33" flood-opacity="0.22"/>
    </filter>
    <filter id="front-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="#091b36" flood-opacity="0.2"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="backFlapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a78e4"/>
      <stop offset="100%" stop-color="#1456b8"/>
    </linearGradient>

    <linearGradient id="frontFlapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#47a5ff"/>
      <stop offset="40%" stop-color="#2e8cf7"/>
      <stop offset="100%" stop-color="#196bdf"/>
    </linearGradient>

    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf2f9"/>
    </linearGradient>

    <linearGradient id="docAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#62a0ea"/>
    </linearGradient>

    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <g filter="url(#folder-shadow)">
    <!-- Back folder body with tab -->
    <path d="M 16,36 C 16,28.27 22.27,22 30,22 L 52,22 C 56.5,22 60.5,24.8 62.5,28.8 L 66,36 L 98,36 C 105.73,36 112,42.27 112,50 L 112,94 C 112,101.73 105.73,108 98,108 L 30,108 C 22.27,108 16,101.73 16,94 Z"
          fill="url(#backFlapGrad)"/>

    <!-- Document sheet inside -->
    <g transform="translate(32, 28)" filter="url(#doc-shadow)">
      <rect x="0" y="0" width="64" height="46" rx="6" fill="url(#docGrad)"/>
      <!-- Sheet header / lines -->
      <rect x="10" y="10" width="24" height="4.5" rx="2.25" fill="url(#docAccentGrad)"/>
      <rect x="10" y="19" width="44" height="3" rx="1.5" fill="#a4bcdb" opacity="0.75"/>
      <rect x="10" y="26" width="36" height="3" rx="1.5" fill="#a4bcdb" opacity="0.75"/>
      <rect x="10" y="33" width="42" height="3" rx="1.5" fill="#a4bcdb" opacity="0.75"/>
    </g>

    <!-- Front folder flap -->
    <g filter="url(#front-shadow)">
      <path d="M 16,56 C 16,48.27 22.27,42 30,42 L 98,42 C 105.73,42 112,48.27 112,56 L 112,94 C 112,101.73 105.73,108 98,108 L 30,108 C 22.27,108 16,101.73 16,94 Z"
            fill="url(#frontFlapGrad)"/>

      <!-- Top edge glossy highlight -->
      <path d="M 30,43 L 98,43 C 104.9,43 110.6,48.2 111.4,55 C 110.8,49.2 105.1,44.5 98,44.5 L 30,44.5 C 22.9,44.5 17.2,49.2 16.6,55 C 17.4,48.2 23.1,43 30,43 Z"
            fill="url(#highlightGrad)"/>
    </g>
  </g>
</svg>
